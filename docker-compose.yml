services:
  web:
    build: .
    container_name: upload-vault
    hostname: upload-vault
    restart: unless-stopped
    user: "10001:10001"
    environment:
      APP_PREFIX: /upload
      MAX_UPLOAD_BYTES: "2147483648"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    networks:
      - reservation_default

networks:
  reservation_default:
    external: true
